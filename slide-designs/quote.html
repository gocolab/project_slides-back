<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Pretendard', 'ui-sans-serif', 'system-ui'] } } }
    }
  </script>
</head>
<body class="w-[720pt] h-[405pt] relative bg-[#1a1a1a] font-sans overflow-hidden">
<!-- ╔══════════════════════════════════════════════════════╗
     ║  PAGE LAYOUT TEMPLATE - quote
     ║  
     ║  구조 설명:
     ║  1. 모든 요소는 position: absolute 를 사용합니다.
     ║  2. z-index 계층: 배경(0) -> 장식(10) -> 이미지(20) -> 텍스트(30)
     ║  3. 좌표 단위: pt (720x405 캔버스 기준)
     ╚══════════════════════════════════════════════════════╝ -->

  <p class="absolute top-[72.5pt] left-[350.9pt] text-[48pt] text-[#444] z-[30]">"</p>
  
  <h2 class="absolute top-[168.5pt] left-[90pt] w-[540pt] text-[28pt] font-normal text-white text-center tracking-[-0.01em] leading-[1.5] z-[30]">
    The best way to predict the future is to create it.
  </h2>

  <p class="absolute top-[292.5pt] left-[299.5pt] w-[121pt] text-[13pt] font-medium text-white text-center z-[30]">Peter Drucker</p>
  <p class="absolute top-[316pt] left-[299.5pt] w-[121pt] text-[11pt] text-[#666] text-center z-[30]">Management Consultant</p>

</body>
</html>
