<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Pretendard', 'ui-sans-serif', 'system-ui'] } } }
    }
  </script>
</head>
<body class="w-[720pt] h-[405pt] relative bg-[#1a1a1a] font-sans overflow-hidden">
<!-- ╔══════════════════════════════════════════════════════╗
     ║  PAGE LAYOUT TEMPLATE - closing
     ║  
     ║  구조 설명:
     ║  1. 모든 요소는 position: absolute 를 사용합니다.
     ║  2. z-index 계층: 배경(0) -> 장식(10) -> 이미지(20) -> 텍스트(30)
     ║  3. 좌표 단위: pt (720x405 캔버스 기준)
     ╚══════════════════════════════════════════════════════╝ -->

  <!-- 로고 -->
  <div class="absolute top-[48pt] left-[48pt] w-[20pt] h-[20pt] bg-white rounded-[4pt] z-[30]">
    <p class="absolute top-[1pt] left-[6.5pt] text-[#1a1a1a] text-[12pt] font-bold">*</p>
  </div>
  <p class="absolute top-[49pt] left-[76pt] text-[12pt] font-semibold text-white z-[30]">LogoName</p>

  <!-- 메인 메시지 -->
  <h1 class="absolute top-[144pt] left-[48pt] w-[624pt] text-[56pt] font-medium text-white tracking-[-0.02em] leading-[1.1] z-[30]">
    Thank You
  </h1>
  <p class="absolute top-[221.5pt] left-[48pt] w-[624pt] text-[16pt] text-[#888] z-[30]">
    Questions? Let's discuss.
  </p>

  <!-- 연락처 정보 -->
  <!-- Email -->
  <p class="absolute top-[321.5pt] left-[48pt] text-[9pt] text-[#666] z-[30]">Email</p>
  <p class="absolute top-[339pt] left-[48pt] text-[12pt] font-medium text-white z-[30]">hello@company.com</p>
  
  <!-- Phone -->
  <p class="absolute top-[321.5pt] left-[225.2pt] text-[9pt] text-[#666] z-[30]">Phone</p>
  <p class="absolute top-[339pt] left-[225.2pt] text-[12pt] font-medium text-white z-[30]">+82 10-1234-5678</p>
  
  <!-- Website -->
  <p class="absolute top-[321.5pt] left-[393.9pt] text-[9pt] text-[#666] z-[30]">Website</p>
  <p class="absolute top-[339pt] left-[393.9pt] text-[12pt] font-medium text-white z-[30]">www.company.com</p>

</body>
</html>
