<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Pretendard', 'ui-sans-serif', 'system-ui'] } } }
    }
  </script>
</head>
<body class="w-[720pt] h-[405pt] relative bg-[#f5f5f0] font-sans overflow-hidden">
<!-- ╔══════════════════════════════════════════════════════╗
     ║  PAGE LAYOUT TEMPLATE - statistics
     ║  
     ║  구조 설명:
     ║  1. 모든 요소는 position: absolute 를 사용합니다.
     ║  2. z-index 계층: 배경(0) -> 장식(10) -> 이미지(20) -> 텍스트(30)
     ║  3. 좌표 단위: pt (720x405 캔버스 기준)
     ╚══════════════════════════════════════════════════════╝ -->

  <!-- 헤더 -->
  <i class="fa-solid fa-chart-bar absolute top-[49pt] left-[48pt] text-[22pt] z-[30]" style="color: #1a1a1a;"></i>
  <h1 class="absolute top-[36pt] left-[84pt] text-[32pt] font-bold text-[#1a1a1a] z-[30]">Key Metrics</h1>
  <p class="absolute top-[52.5pt] left-[660pt] text-[10pt] text-[#999] z-[30]">03</p>

  <!-- 통계 카드 1 -->
  <div class="absolute top-[112pt] left-[48pt] w-[192pt] h-[229.5pt] bg-[#1a1a1a] rounded-[12pt] z-[20]"></div>
  <i class="fa-solid fa-arrow-trend-up absolute top-[137.2pt] left-[72pt] text-[14pt] z-[30]" style="color: #888;"></i>
  <p class="absolute top-[136pt] left-[95.7pt] text-[11pt] text-[#888] uppercase tracking-[0.05em] z-[30]">지표 제목 1</p>
  <p class="absolute top-[233.5pt] left-[72pt] w-[144pt] text-[44pt] font-bold text-white tracking-[-0.02em] z-[30]">85%</p>
  <p class="absolute top-[299.5pt] left-[72pt] w-[144pt] text-[12pt] text-[#666] z-[30]">설명 한 줄</p>

  <!-- 통계 카드 2 -->
  <div class="absolute top-[112pt] left-[264pt] w-[192pt] h-[229.5pt] bg-white rounded-[12pt] border border-[#e5e5e0] z-[20]"></div>
  <i class="fa-solid fa-users absolute top-[138pt] left-[288.8pt] text-[14pt] z-[30]" style="color: #888;"></i>
  <p class="absolute top-[136.7pt] left-[314.3pt] text-[11pt] text-[#888] uppercase tracking-[0.05em] z-[30]">지표 제목 2</p>
  <p class="absolute top-[232.8pt] left-[288.8pt] w-[142.5pt] text-[44pt] font-bold text-[#1a1a1a] tracking-[-0.02em] z-[30]">2.4M</p>
  <p class="absolute top-[298.8pt] left-[288.8pt] w-[142.5pt] text-[12pt] text-[#888] z-[30]">설명 한 줄</p>

  <!-- 통계 카드 3 -->
  <div class="absolute top-[112pt] left-[480pt] w-[192pt] h-[229.5pt] bg-white rounded-[12pt] border border-[#e5e5e0] z-[20]"></div>
  <i class="fa-solid fa-star absolute top-[138pt] left-[504.8pt] text-[14pt] z-[30]" style="color: #888;"></i>
  <p class="absolute top-[136.7pt] left-[528.5pt] text-[11pt] text-[#888] uppercase tracking-[0.05em] z-[30]">지표 제목 3</p>
  <p class="absolute top-[232.8pt] left-[504.8pt] w-[142.5pt] text-[44pt] font-bold text-[#1a1a1a] tracking-[-0.02em] z-[30]">4.9</p>
  <p class="absolute top-[298.8pt] left-[504.8pt] w-[142.5pt] text-[12pt] text-[#888] z-[30]">설명 한 줄</p>

  <!-- 푸터 -->
  <p class="absolute top-[355.5pt] left-[546.6pt] text-[9pt] text-[#999] z-[30]">Source: Internal Analytics 2025</p>

</body>
</html>
