<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Pretendard', 'ui-sans-serif', 'system-ui'] } } }
    }
  </script>
</head>
<body class="w-[720pt] h-[405pt] relative bg-white font-sans text-[#111827] overflow-hidden">
<!-- ╔══════════════════════════════════════════════════════╗
     ║  PAGE LAYOUT TEMPLATE - diagram
     ║  
     ║  구조 설명:
     ║  1. 모든 요소는 position: absolute 를 사용합니다.
     ║  2. z-index 계층: 배경(0) -> 장식(10) -> 이미지(20) -> 텍스트(30)
     ║  3. 좌표 단위: pt (720x405 캔버스 기준)
     ╚══════════════════════════════════════════════════════╝ -->

  <!-- 헤더 -->
  <i class="fa-solid fa-diagram-project absolute top-[49pt] left-[40pt] text-[22pt] z-[30]" style="color: #111827;"></i>
  <h1 class="absolute top-[36pt] left-[78.7pt] text-[32pt] font-bold tracking-[-0.01em] z-[30]">Process Diagram</h1>
  <p class="absolute top-[57.2pt] left-[636.4pt] text-[10pt] text-[#6b7280] z-[30]">DIAGRAM</p>

  <p class="absolute top-[102pt] left-[40pt] w-[640pt] text-[14pt] text-[#4b5563] z-[30]">
    핵심 프로세스·구조를 SVG 다이어그램으로 시각화합니다.
  </p>

  <!-- SVG 다이어그램 영역 -->
  <div class="absolute top-[139pt] left-[40pt] w-[640pt] h-[206.5pt] border border-[#e5e7eb] rounded-[10pt] z-[20]">
    <div data-svg-placeholder class="absolute top-[71.2pt] left-[255pt] w-[130pt] h-[64pt]">
      <i class="fa-solid fa-diagram-project absolute top-[0pt] left-[45pt] text-[40pt] text-[#e5e7eb]"></i>
      <p class="absolute top-[48pt] left-[0pt] w-[130pt] text-center text-[12pt] text-[#9ca3af]">SVG 다이어그램 영역</p>
    </div>
  </div>

  <!-- 푸터 -->
  <p class="absolute top-[355.5pt] left-[40pt] w-[640pt] text-[9pt] text-[#9ca3af] z-[30]">Diagram generated by AI</p>

</body>
</html>
