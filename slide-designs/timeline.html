<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Pretendard', 'ui-sans-serif', 'system-ui'] } } }
    }
  </script>
</head>
<body class="w-[720pt] h-[405pt] relative bg-white font-sans overflow-hidden">
<!-- ╔══════════════════════════════════════════════════════╗
     ║  PAGE LAYOUT TEMPLATE - timeline
     ║  
     ║  구조 설명:
     ║  1. 모든 요소는 position: absolute 를 사용합니다.
     ║  2. z-index 계층: 배경(0) -> 장식(10) -> 이미지(20) -> 텍스트(30)
     ║  3. 좌표 단위: pt (720x405 캔버스 기준)
     ╚══════════════════════════════════════════════════════╝ -->

  <!-- 헤더 -->
  <i class="fa-solid fa-timeline absolute top-[49pt] left-[48pt] text-[22pt] z-[30]" style="color: #1a1a1a;"></i>
  <h1 class="absolute top-[36pt] left-[89.5pt] text-[32pt] font-bold text-[#1a1a1a] z-[30]">Our Journey</h1>

  <!-- 타임라인 연결선 -->
  <div class="absolute top-[190.5pt] left-[88pt] w-[544pt] h-[2pt] bg-[#e5e5e0] z-[10]"></div>

  <!-- 타임라인 아이템 1 -->
  <div class="absolute top-[178.5pt] left-[70.6pt] w-[26pt] h-[26pt] bg-[#1a1a1a] rounded-full z-[20]">

  </div>
  <p class="absolute top-[216.5pt] left-[55.3pt] w-[56.7pt] text-center text-[18pt] font-semibold text-[#1a1a1a] z-[30]">STEP 1</p>
  <p class="absolute top-[255.5pt] left-[48pt] w-[71.3pt] text-center text-[12pt] text-[#666] leading-[1.5] z-[30]">단계 설명 한 줄</p>

  <!-- 타임라인 아이템 2 -->
  <div class="absolute top-[178.5pt] left-[254.9pt] w-[26pt] h-[26pt] bg-[#1a1a1a] rounded-full z-[20]">
    <i class="fa-solid fa-gear absolute top-[8pt] left-[8pt] text-[10pt] text-white"></i>
  </div>
  <p class="absolute top-[216.5pt] left-[238.2pt] w-[59.3pt] text-center text-[18pt] font-semibold text-[#1a1a1a] z-[30]">STEP 2</p>
  <p class="absolute top-[255.5pt] left-[232.2pt] w-[71.3pt] text-center text-[12pt] text-[#666] leading-[1.5] z-[30]">단계 설명 한 줄</p>

  <!-- 타임라인 아이템 3 -->
  <div class="absolute top-[178.5pt] left-[439.1pt] w-[26pt] h-[26pt] bg-[#1a1a1a] rounded-full z-[20]">
    <i class="fa-solid fa-rocket absolute top-[8pt] left-[8pt] text-[10pt] text-white"></i>
  </div>
  <p class="absolute top-[216.5pt] left-[422.2pt] w-[59.8pt] text-center text-[18pt] font-semibold text-[#1a1a1a] z-[30]">STEP 3</p>
  <p class="absolute top-[255.5pt] left-[416.5pt] w-[71.3pt] text-center text-[12pt] text-[#666] leading-[1.5] z-[30]">단계 설명 한 줄</p>

  <!-- 타임라인 아이템 4 -->
  <div class="absolute top-[178.5pt] left-[623.4pt] w-[26pt] h-[26pt] bg-[#1a1a1a] rounded-full z-[20]">
    <i class="fa-solid fa-trophy absolute top-[8pt] left-[8pt] text-[10pt] text-white"></i>
  </div>
  <p class="absolute top-[216.5pt] left-[606.3pt] w-[60pt] text-center text-[18pt] font-semibold text-[#1a1a1a] z-[30]">STEP 4</p>
  <p class="absolute top-[255.5pt] left-[600.7pt] w-[71.3pt] text-center text-[12pt] text-[#666] leading-[1.5] z-[30]">단계 설명 한 줄</p>

  <!-- 푸터 -->
  <p class="absolute top-[354pt] left-[660pt] text-[10pt] text-[#666] z-[30]">06</p>

</body>
</html>
