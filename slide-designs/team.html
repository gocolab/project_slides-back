<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Pretendard', 'ui-sans-serif', 'system-ui'] } } }
    }
  </script>
</head>
<body class="w-[720pt] h-[405pt] relative bg-[#f5f5f0] font-sans overflow-hidden">
<!-- ╔══════════════════════════════════════════════════════╗
     ║  PAGE LAYOUT TEMPLATE - team
     ║  
     ║  구조 설명:
     ║  1. 모든 요소는 position: absolute 를 사용합니다.
     ║  2. z-index 계층: 배경(0) -> 장식(10) -> 이미지(20) -> 텍스트(30)
     ║  3. 좌표 단위: pt (720x405 캔버스 기준)
     ╚══════════════════════════════════════════════════════╝ -->

  <!-- 헤더 -->
  <h2 class="absolute top-[40pt] left-[48pt] text-[28pt] font-semibold text-[#1a1a1a] z-[30]">Our Team</h2>
  <p class="absolute top-[53.5pt] left-[660.1pt] text-[10pt] text-[#999] z-[30]">05</p>

  <!-- 팀원 1 -->
  <div class="absolute top-[114pt] left-[48pt] w-[141pt] h-[200pt] z-[30]">
    <div class="absolute top-[0pt] left-[0pt] w-[141pt] h-[141pt] bg-[#d0d0c8] rounded-[8pt] z-[20]"></div>
    <p class="absolute top-[153pt] left-[0pt] w-[141pt] text-center text-[13pt] font-semibold text-[#1a1a1a]">John Smith</p>
    <p class="absolute top-[176.5pt] left-[0pt] w-[141pt] text-center text-[10pt] text-[#888]">CEO & Founder</p>
  </div>

  <!-- 팀원 2 -->
  <div class="absolute top-[114pt] left-[209pt] w-[141pt] h-[200pt] z-[30]">
    <div class="absolute top-[0pt] left-[0pt] w-[141pt] h-[141pt] bg-[#d0d0c8] rounded-[8pt] z-[20]"></div>
    <p class="absolute top-[153pt] left-[0pt] w-[141pt] text-center text-[13pt] font-semibold text-[#1a1a1a]">Sarah Johnson</p>
    <p class="absolute top-[176.5pt] left-[0pt] w-[141pt] text-center text-[10pt] text-[#888]">CTO</p>
  </div>

  <!-- 팀원 3 -->
  <div class="absolute top-[114pt] left-[370pt] w-[141pt] h-[200pt] z-[30]">
    <div class="absolute top-[0pt] left-[0pt] w-[141pt] h-[141pt] bg-[#d0d0c8] rounded-[8pt] z-[20]"></div>
    <p class="absolute top-[153pt] left-[0pt] w-[141pt] text-center text-[13pt] font-semibold text-[#1a1a1a]">Mike Chen</p>
    <p class="absolute top-[176.5pt] left-[0pt] w-[141pt] text-center text-[10pt] text-[#888]">Design Lead</p>
  </div>

  <!-- 팀원 4 -->
  <div class="absolute top-[114pt] left-[531pt] w-[141pt] h-[200pt] z-[30]">
    <div class="absolute top-[0pt] left-[0pt] w-[141pt] h-[141pt] bg-[#d0d0c8] rounded-[8pt] z-[20]"></div>
    <p class="absolute top-[153pt] left-[0pt] w-[141pt] text-center text-[13pt] font-semibold text-[#1a1a1a]">Emily Davis</p>
    <p class="absolute top-[176.5pt] left-[0pt] w-[141pt] text-center text-[10pt] text-[#888]">Marketing</p>
  </div>

</body>
</html>
