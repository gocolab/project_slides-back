<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Pretendard', 'ui-sans-serif', 'system-ui'] } } }
    }
  </script>
</head>
<body class="w-[720pt] h-[405pt] relative bg-[#b8c4b8] font-sans overflow-hidden">
<!-- ╔══════════════════════════════════════════════════════╗
     ║  PAGE LAYOUT TEMPLATE - contents
     ║  
     ║  구조 설명:
     ║  1. 모든 요소는 position: absolute 를 사용합니다.
     ║  2. z-index 계층: 배경(0) -> 장식(10) -> 이미지(20) -> 텍스트(30)
     ║  3. 좌표 단위: pt (720x405 캔버스 기준)
     ╚══════════════════════════════════════════════════════╝ -->

  <!-- 왼쪽 고정 영역 -->
  <p class="absolute top-[148.3pt] left-[48pt] w-[224.7pt] text-[9pt] text-[#3d3d3d] uppercase tracking-[0.1em] z-[30]">©2025 YOUR BRAND. ALL RIGHTS RESERVED.</p>
  <h1 class="absolute top-[177.8pt] left-[48pt] w-[224.7pt] text-[56pt] font-medium text-[#1a1a1a] tracking-[-0.02em] leading-[1.1] z-[30]">
    Our<br>Contents

  <div class="absolute top-[325pt] left-[48pt] w-[32pt] h-[32pt] border border-[#1a1a1a] rounded-full flex items-center justify-center z-[20]">

  </div>

  <!-- 오른쪽 목차 영역 -->
  <!-- Item 1 -->
  <p class="absolute top-[70.5pt] left-[320.7pt] px-[10pt] py-[4pt] bg-[#1a1a1a] text-white rounded-[4pt] text-[8pt] font-semibold z-[30]">SECTION 1</p>
  <p class="absolute top-[70pt] left-[396.4pt] w-[243.9pt] text-[14pt] font-medium text-[#1a1a1a] z-[30]">SECTION TITLE</p>
  <p class="absolute top-[70pt] left-[656.3pt] text-[14pt] text-[#666] z-[30]">(1)</p>
  <div class="absolute top-[102pt] left-[320.7pt] right-[48pt] border-b border-black/10 z-[10]"></div>

  <!-- Item 2 -->
  <p class="absolute top-[131.5pt] left-[320.7pt] px-[10pt] py-[4pt] bg-[#1a1a1a] text-white rounded-[4pt] text-[8pt] font-semibold z-[30]">SECTION 2</p>
  <p class="absolute top-[131pt] left-[397.6pt] w-[240.7pt] text-[14pt] font-medium text-[#1a1a1a] z-[30]">SECTION TITLE</p>
  <p class="absolute top-[131pt] left-[654.2pt] text-[14pt] text-[#666] z-[30]">(2)</p>
  <div class="absolute top-[163pt] left-[320.7pt] right-[48pt] border-b border-black/10 z-[10]"></div>

  <!-- Item 3 -->
  <p class="absolute top-[192.5pt] left-[320.7pt] px-[10pt] py-[4pt] bg-[#1a1a1a] text-white rounded-[4pt] text-[8pt] font-semibold z-[30]">SECTION 3</p>
  <p class="absolute top-[192pt] left-[397.8pt] w-[240pt] text-[14pt] font-medium text-[#1a1a1a] z-[30]">SECTION TITLE</p>
  <p class="absolute top-[192pt] left-[653.8pt] text-[14pt] text-[#666] z-[30]">(3)</p>
  <div class="absolute top-[224pt] left-[320.7pt] right-[48pt] border-b border-black/10 z-[10]"></div>

  <!-- Item 4 -->
  <p class="absolute top-[253.5pt] left-[320.7pt] px-[10pt] py-[4pt] bg-[#1a1a1a] text-white rounded-[4pt] text-[8pt] font-semibold z-[30]">SECTION 4</p>
  <p class="absolute top-[253pt] left-[397.9pt] w-[239.8pt] text-[14pt] font-medium text-[#1a1a1a] z-[30]">SECTION TITLE</p>
  <p class="absolute top-[253pt] left-[653.7pt] text-[14pt] text-[#666] z-[30]">(4)</p>
  <div class="absolute top-[285pt] left-[320.7pt] right-[48pt] border-b border-black/10 z-[10]"></div>

  <!-- Item 5 -->
  <p class="absolute top-[314.5pt] left-[320.7pt] px-[10pt] py-[4pt] bg-[#1a1a1a] text-white rounded-[4pt] text-[8pt] font-semibold z-[30]">SECTION 5</p>
  <p class="absolute top-[314pt] left-[397.7pt] w-[240.4pt] text-[14pt] font-medium text-[#1a1a1a] z-[30]">SECTION TITLE</p>
  <p class="absolute top-[314pt] left-[654.1pt] text-[14pt] text-[#666] z-[30]">(5)</p>

</body>
</html>
