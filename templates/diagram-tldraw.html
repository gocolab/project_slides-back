<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', 'ui-sans-serif', 'system-ui'],
          },
        },
      },
    }
  </script>
</head>
<body class="w-[720pt] h-[405pt] p-[34pt_40pt_28pt] flex flex-col gap-[12pt] bg-white font-sans text-[#111827]">
  <div class="flex justify-between items-baseline">
    <h2 class="text-[28pt] font-bold tracking-[-0.01em]">System Diagram</h2>
    <p class="text-[10pt] text-[#6b7280]">DIAGRAM / TLDRAW</p>
  </div>

  <p class="text-[12pt] text-[#4b5563]">
    Render a current-format local .tldr file with slides-grab tldraw, then reference the generated SVG asset below.
  </p>

  <div class="flex-1 min-h-0 border border-[#e5e7eb] rounded-[14pt] bg-[#f8fafc] p-[12pt] flex items-center justify-center overflow-hidden">
    <img src="./assets/diagram.svg" alt="System architecture diagram" class="block w-full h-full object-contain" />
  </div>

  <p class="text-[9pt] text-[#9ca3af]">
    Example asset path: ./assets/diagram.svg
  </p>
</body>
</html>
