<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', 'ui-sans-serif', 'system-ui'],
          },
        },
      },
    }
  </script>
</head>
<body class="w-[720pt] h-[405pt] grid grid-cols-2 bg-white font-sans">
  <!-- 이미지 영역 -->
  <div class="bg-[#e5e5e0] flex items-center justify-center relative">
    <div data-image-placeholder class="w-full h-full border border-dashed border-[#b8b8b0] bg-[#d9d9d2] flex items-center justify-center">
      <p class="text-[11pt] font-semibold tracking-[0.06em] text-[#5f5f58] uppercase">Image Placeholder</p>
    </div>
    <p class="absolute bottom-[16pt] left-[16pt] text-[9pt] text-[#666]">©2025 YOUR BRAND</p>
  </div>

  <!-- 텍스트 영역 -->
  <div class="p-[48pt] flex flex-col justify-center">
    <p class="inline-block px-[10pt] py-[4pt] bg-[#1a1a1a] text-white rounded-[4pt] text-[8pt] font-semibold mb-[24pt] self-start">FEATURE</p>
    <h2 class="text-[32pt] font-semibold text-[#1a1a1a] tracking-[-0.01em] leading-[1.2] mb-[20pt]">
      Transform Your Business
    </h2>
    <p class="text-[14pt] text-[#666] leading-[1.7]">
      Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.
    </p>
    <div class="mt-[32pt] flex items-center gap-[12pt]">
      <p class="text-[12pt] font-medium text-[#1a1a1a]">Learn more</p>
      <div class="w-[28pt] h-[28pt] border border-[#1a1a1a] rounded-full flex items-center justify-center">
        <p class="text-[12pt] text-[#1a1a1a]">→</p>
      </div>
    </div>
  </div>
</body>
</html>
