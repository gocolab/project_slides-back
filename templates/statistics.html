<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', 'ui-sans-serif', 'system-ui'],
          },
        },
      },
    }
  </script>
</head>
<body class="w-[720pt] h-[405pt] p-[40pt_48pt] flex flex-col bg-[#f5f5f0] font-sans">
  <!-- 헤더 -->
  <div class="flex justify-between items-center mb-[32pt]">
    <h2 class="text-[28pt] font-semibold text-[#1a1a1a]">Key Metrics</h2>
    <p class="text-[10pt] text-[#999]">03</p>
  </div>

  <!-- 통계 카드 그리드 -->
  <div class="flex-1 grid grid-cols-3 gap-[24pt]">
    <div class="bg-[#1a1a1a] rounded-[12pt] p-[28pt] flex flex-col justify-between">
      <p class="text-[10pt] text-[#888] uppercase tracking-[0.05em]">Revenue Growth</p>
      <div>
        <p class="text-[48pt] font-semibold text-white tracking-[-0.02em]">85%</p>
        <p class="text-[11pt] text-[#666] mt-[8pt]">Year over year</p>
      </div>
    </div>
    <div class="bg-white rounded-[12pt] p-[28pt] flex flex-col justify-between border border-[#e5e5e0]">
      <p class="text-[10pt] text-[#888] uppercase tracking-[0.05em]">Active Users</p>
      <div>
        <p class="text-[48pt] font-semibold text-[#1a1a1a] tracking-[-0.02em]">2.4M</p>
        <p class="text-[11pt] text-[#888] mt-[8pt]">+340K this quarter</p>
      </div>
    </div>
    <div class="bg-white rounded-[12pt] p-[28pt] flex flex-col justify-between border border-[#e5e5e0]">
      <p class="text-[10pt] text-[#888] uppercase tracking-[0.05em]">Customer Satisfaction</p>
      <div>
        <p class="text-[48pt] font-semibold text-[#1a1a1a] tracking-[-0.02em]">4.9</p>
        <p class="text-[11pt] text-[#888] mt-[8pt]">Out of 5.0 rating</p>
      </div>
    </div>
  </div>

  <!-- 푸터 -->
  <div class="flex justify-end pt-[16pt]">
    <p class="text-[9pt] text-[#999]">Source: Internal Analytics 2025</p>
  </div>
</body>
</html>
